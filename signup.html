<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - IST256 Community Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- nav menu replicated on every page -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">IST256 Community Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="signup.html">Sign Up</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- sign up form -->
  <main class="container mt-5" style="max-width: 600px;">
    <h1 class="mb-4">Member Sign Up</h1>

    <!-- success message shown after a valid submission -->
    <div id="message" class="alert alert-success d-none"></div>

    <form id="signupForm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name *</label>
        <input type="text" class="form-control" id="name">
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address *</label>
        <input type="email" class="form-control" id="email">
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number (optional)</label>
        <input type="tel" class="form-control" id="phone" placeholder="814-555-0123">
        <div class="invalid-feedback">Phone must be 10 digits, like 814-555-0123.</div>
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age *</label>
        <input type="number" class="form-control" id="age">
        <div class="invalid-feedback">Age must be a whole number from 13 to 120.</div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address *</label>
        <input type="text" class="form-control" id="address">
        <div class="invalid-feedback">Please enter your address.</div>
      </div>

      <button type="submit" class="btn btn-success">Sign Up</button>
    </form>
  </main>

  <footer class="text-center">
    <div class="container">&copy; 2026 Group 10 - IST 256</div>
  </footer>

  <!-- add bootstrap and our scripts to be loaded into the page -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
