<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - IST256 Community Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- nav menu replicated on every page -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Community Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
          <li class="nav-item"><a class="nav-link" href="posts.html">Posts</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- product management page -->
  <main class="container mt-5">
    <h1 class="mb-4">Community Marketplace Products</h1>

    <!-- jquery search control -->
    <div class="row g-3 mb-3">
      <div class="col-md-12">
        <input type="text" class="form-control" id="search" placeholder="Search products by any word...">
      </div>
    </div>

    <!-- table body is filled in by products.js -->
    <div class="table-responsive">
      <table class="table table-striped bg-white">
        <thead class="table-dark">
          <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
    <p id="emptyMsg" class="text-muted d-none">No products match your search.</p>

    <h2 class="mt-4">Stored JSON</h2>
    <pre id="jsonView" class="bg-white border p-3"></pre>
  </main>

  <footer class="text-center mt-5 mb-3">
    <div class="container">&copy; 2026 Group 10 - IST 256</div>
  </footer>

  <!-- add jquery, bootstrap and our scripts to be loaded into the page -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
